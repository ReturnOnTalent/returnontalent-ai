  <rect x="410" y="580" width="330" height="44" rx="22" fill="#EFECF9"/><text x="575" y="607" font-size="15" font-weight="500" fill="#55267E" text-anchor="middle">Nine-dimension read</text>
  <rect x="760" y="580" width="330" height="44" rx="22" fill="#EFECF9"/><text x="925" y="607" font-size="15" font-weight="500" fill="#55267E" text-anchor="middle">Internal opportunity match</text>
