<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Poppins, Montserrat, -apple-system, Segoe UI, sans-serif">
  <rect width="1200" height="675" rx="20" fill="#FFFFFF" stroke="#EFECF9" stroke-width="3"/>
  <rect width="1200" height="120" rx="20" fill="#55267E"/><rect y="70" width="1200" height="50" fill="#55267E"/>
  <rect x="48" y="34" width="88" height="52" rx="10" fill="#2FCD71"/><text x="92" y="69" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">M2</text>
  <text x="160" y="62" font-size="32" font-weight="700" fill="#FFFFFF">Hidden Talent Identification</text>
  <text x="160" y="100" font-size="19" font-weight="400" fill="#D8CCEC">Who is being missed?</text>
  <g><rect x="880" y="30" width="286" height="42" rx="21" fill="#2FCD71"/><text x="1023" y="58" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">LAUNCHING Q1 2027</text></g>

  <text x="60" y="182" font-size="22" font-weight="600" fill="#33343F">Agility: the cheapest hire is on your payroll</text>
  <text x="60" y="214" font-size="18" font-weight="400" fill="#8F8F8F">A nine-dimension read of performance and potential, mapped to each employee's career priorities.</text>

  <!-- column headers (Performance) -->
  <text x="370" y="266" font-size="14" font-weight="600" fill="#8F8F8F" text-anchor="middle">Low performance</text>
  <text x="685" y="266" font-size="14" font-weight="600" fill="#8F8F8F" text-anchor="middle">Medium performance</text>
  <text x="1000" y="266" font-size="14" font-weight="600" fill="#8F8F8F" text-anchor="middle">High performance</text>

  <!-- cells -->
  <rect x="220" y="282" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>
  <rect x="535" y="282" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>
  <rect x="850" y="282" width="300" height="80" rx="12" fill="#2FCD71" stroke="#1F7A45" stroke-width="2"/>
  <rect x="220" y="372" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>
  <rect x="535" y="372" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>
  <rect x="850" y="372" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>
  <rect x="220" y="462" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>
  <rect x="535" y="462" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>
  <rect x="850" y="462" width="300" height="80" rx="12" fill="#EFECF9" stroke="#D8CCEC" stroke-width="2"/>

  <!-- cell labels -->
  <text x="370" y="327" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Grow</text>
  <text x="685" y="327" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Fast-track</text>
  <text x="1000" y="327" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">HIRE FROM WITHIN</text>
  <text x="370" y="417" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Coach</text>
  <text x="685" y="417" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Core talent</text>
  <text x="1000" y="417" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Reward</text>
  <text x="370" y="507" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Manage</text>
  <text x="685" y="507" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Solid</text>
  <text x="1000" y="507" font-size="14" font-weight="600" fill="#33343F" text-anchor="middle">Expert</text>

