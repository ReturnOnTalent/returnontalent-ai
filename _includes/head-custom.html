<meta name="description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines }}{% else %}{{ site.description | strip_newlines }}{% endif %}">

<meta property="og:site_name" content="ReturnOnTalent AI">
<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.title %}{{ page.title | strip_html | strip_newlines }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines }}{% else %}{{ site.description | strip_newlines }}{% endif %}">
<meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/hero-ai-singapore.png">
<meta property="og:image:width" content="1400">
<meta property="og:image:height" content="700">
<meta property="og:image:alt" content="ReturnOnTalent AI — the retention engine, built with AI Singapore">
<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{% if page.title %}{{ page.title | strip_html | strip_newlines }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{% if page.description %}{{ page.description | strip_html | strip_newlines }}{% else %}{{ site.description | strip_newlines }}{% endif %}">
<meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/hero-ai-singapore.png">
<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "ReturnOnTalent",
  "url": "https://www.returnontalent.io/",
  "parentOrganization": {
    "@type": "Organization",
    "name": "WeLinkTalent Pte Ltd"
  },
  "sameAs": [
    "https://www.linkedin.com/company/returnontalent/"
  ]
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "ReturnOnTalent AI",
  "url": "{{ site.url }}{{ site.baseurl }}/"
}
</script>

{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Is ReturnOnTalent AI available today?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The core engine has been delivered in partnership with AI Singapore; the product is not yet released. WeLinkTalent is now productising it and opening a small number of pilots."
      }
    },
    {
      "@type": "Question",
      "name": "Who is ReturnOnTalent AI for?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "CHROs, Heads of People Analytics and HR transformation leads, and the CFOs and COOs who hold the budget for retention."
      }
    },
    {
      "@type": "Question",
      "name": "Who built the retention engine?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "WeLinkTalent co-developed the core engine with AI Singapore's AI Apprenticeship Programme (AIAP), Industry track, Batch 22. The intellectual property belongs to WeLinkTalent Pte Ltd."
      }
    },
    {
      "@type": "Question",
      "name": "Does it replace our HRMS?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No. It sits alongside your HRMS and adds the retention layer those systems do not cover."
      }
    },
    {
      "@type": "Question",
      "name": "Is employee data safe?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "ReturnOnTalent is designed to comply with PDPA and GDPR. HR governs the process, and every score carries its source evidence."
      }
    }
  ]
}
</script>
{% endif %}
