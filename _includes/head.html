<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ "/assets/favicon.png" | relative_url }}">
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == "production" and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/rot-logo-square.png">
  <meta property="og:image:width" content="1024">
  <meta property="og:image:height" content="1024">
  <meta property="og:image:alt" content="ReturnOnTalent">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/rot-logo-square.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ReturnOnTalent",
    "url": "https://www.returnontalent.io/",
    "parentOrganization": { "@type": "Organization", "name": "WeLinkTalent Pte Ltd" },
    "sameAs": ["https://www.linkedin.com/company/returnontalent/"]
  }
  </script>

  {% if page.url == "/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {"@type": "Question", "name": "Is ReturnOnTalent AI available today?", "acceptedAnswer": {"@type": "Answer", "text": "The core engine has been delivered in partnership with AI Singapore; the product is not yet released. WeLinkTalent is now productising it and opening a small number of pilots."}},
      {"@type": "Question", "name": "Who is ReturnOnTalent AI for?", "acceptedAnswer": {"@type": "Answer", "text": "CHROs, Heads of People Analytics and HR transformation leads, and the CFOs and COOs who hold the budget for retention."}},
      {"@type": "Question", "name": "Who built the retention engine?", "acceptedAnswer": {"@type": "Answer", "text": "WeLinkTalent co-developed the core engine with AI Singapore's AI Apprenticeship Programme (AIAP), Industry track, Batch 22. The intellectual property belongs to WeLinkTalent Pte Ltd."}},
      {"@type": "Question", "name": "Does it replace our HRMS?", "acceptedAnswer": {"@type": "Answer", "text": "No. It sits alongside your HRMS and adds the retention layer those systems do not cover."}},
      {"@type": "Question", "name": "Is employee data safe?", "acceptedAnswer": {"@type": "Answer", "text": "ReturnOnTalent is designed to comply with PDPA and GDPR. HR governs the process, and every score carries its source evidence."}}
    ]
  }
  </script>
  {% endif %}
</head>
